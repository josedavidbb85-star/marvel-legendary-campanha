<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marvel Legendary — Sala</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#060b13;color:#eef4ff;font-family:system-ui,Arial}.app{height:100vh;padding:8px;display:grid;grid-template-rows:auto auto 1fr auto;gap:7px;max-width:1200px;margin:auto}.top,.stats,.city,.roomrow{display:flex;gap:6px;align-items:center}.top{justify-content:space-between}h1{font-size:18px;margin:0}.muted{color:#9fb0c6;font-size:11px}.stats>div,.slot,.panel{background:#101a2a;border:1px solid #334866;border-radius:10px;padding:7px}.stats{overflow:auto}.stats>div{white-space:nowrap;font-size:12px}.city{min-height:0}.slot{flex:1;height:100%;min-width:0;display:flex;flex-direction:column}.slot h3{font-size:11px;margin:0 0 5px;color:#afc5e1}.card{flex:1;min-height:0;border-radius:7px;background:#17243a center/contain no-repeat;border:1px solid #5e7698;cursor:zoom-in;position:relative}.card span{position:absolute;bottom:4px;left:4px;right:4px;font-size:10px;font-weight:800;text-shadow:0 2px 3px #000}.panel{font-size:12px}button,input,select{background:#17243a;color:#eef4ff;border:1px solid #526b8d;border-radius:8px;padding:8px;font-weight:700}button{cursor:pointer}.primary{background:#285c98}.modal,.zoom{position:fixed;inset:0;background:#000d;display:none;place-items:center;padding:12px;z-index:20}.modal.open,.zoom.open{display:grid}.box{width:min(650px,96vw);background:#101a2a;border:1px solid #526b8d;border-radius:14px;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.zoom img{max-width:94vw;max-height:92vh;border-radius:12px}.players{margin-top:8px}.player{padding:5px 0;border-top:1px solid #293b55}.live{color:#8be5b1}.warn{color:#f0d384}@media(max-width:650px){.app{padding:5px}.top .muted{display:none}.stats>div{padding:5px;font-size:10px}.city{gap:3px}.slot{padding:3px}.slot h3{font-size:8px}.card span{font-size:7px}.grid{grid-template-columns:1fr}button{padding:7px;font-size:11px}}</style></head><body><main class="app"><div class="top"><div><div class="muted">MARVEL LEGENDARY • CAMPANHA II • PROTÓTIPO</div><h1>O SINAL</h1></div><div><button id="room">👥 SALA</button> <button id="reveal" class="primary">REVELAR CARTA</button></div></div><div class="stats"><div>DECK <b id="total">9</b></div><div>👹 <b id="villains">5</b></div><div>🌀 <b id="twists">1</b></div><div>💥 <b id="strikes">1</b></div><div>👤 <b id="bystanders">2</b></div><div>THREAT <b id="threat">1</b></div></div><section class="city" id="city"></section><section class="panel" id="event">Crie uma sala compartilhada ou revele a primeira carta.</section></main><div class="modal" id="modal"><div class="box"><div style="display:flex;justify-content:space-between"><div><div class="muted">PARTIDA COMPARTILHADA</div><h2 style="margin:2px 0">Sala</h2></div><button id="close">×</button></div><div class="grid"><div><h3>Criar sala</h3><select id="hostName"><option>David</option><option>Bel</option><option>Guilherme</option></select> <button id="create" class="primary">CRIAR</button><p>Código: <b id="code">—</b></p></div><div><h3>Entrar</h3><select id="joinName"><option>Bel</option><option>Guilherme</option><option>David</option></select><input id="joinCode" placeholder="Código"><button id="join" class="primary">ENTRAR</button></div></div><p id="status" class="warn">Configure multiplayer-config.js para sincronização real.</p><div id="players" class="players"></div></div></div><div class="zoom" id="zoom"><img id="zoomImg" alt="Carta ampliada"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="multiplayer-config.js"></script><script>const $=id=>document.getElementById(id),spaces=['Sewers','Bank','Rooftops','Streets','Bridge'];const initial=[{t:'villain',n:'Agente Cósmico',a:3},{t:'villain',n:'Invasor Estelar',a:4},{t:'bystander',n:'Bystander'},{t:'twist',n:'Scheme Twist'},{t:'villain',n:'Sentinela do Vazio',a:5},{t:'strike',n:'Master Strike'},{t:'villain',n:'Caçador Cósmico',a:4},{t:'bystander',n:'Bystander'},{t:'villain',n:'Sonda Hostil',a:2}];let S={deck:structuredClone(initial),city:[null,null,null,null,null],threat:1},ch=null,me='',host=false,applying=false;function counts(){let c={villain:0,twist:0,strike:0,bystander:0};S.deck.forEach(x=>c[x.t]=(c[x.t]||0)+1);$('total').textContent=S.deck.length;$('villains').textContent=c.villain;$('twists').textContent=c.twist;$('strikes').textContent=c.strike;$('bystanders').textContent=c.bystander;$('threat').textContent=S.threat}function render(){counts();$('city').innerHTML=spaces.map((x,i)=>`<div class="slot"><h3>${x}</h3>${S.city[i]?`<div class="card" data-i="${i}"><span>${S.city[i].n}${S.city[i].a?' • '+S.city[i].a+'⚔':''}</span></div>`:'<div class="muted">Vazio</div>'}</div>`).join('');if(!applying)broadcast()}function reveal(){if(!S.deck.length)return;let c=S.deck.shift();if(c.t==='villain'){let esc=S.city[4];for(let i=4;i>0;i--)S.city[i]=S.city[i-1];S.city[0]=c;$('event').innerHTML=`<b>${c.n}</b> entra em Sewers.${esc?' '+esc.n+' escapou!':''}`}else $('event').innerHTML=`<b>${c.n}</b> revelado. Resolva o efeito e continue.`;render()}const cfg=window.MARVEL_MULTIPLAYER||{},enabled=cfg.supabaseUrl&&cfg.supabaseKey&&window.supabase,client=enabled?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey):null;async function broadcast(){if(ch&&!applying)await ch.send({type:'broadcast',event:'state',payload:{state:S,from:me}})}async function connect(code,name,isHost){me=name;host=isHost;if(!enabled){$('status').innerHTML='Modo local. Falta configurar Supabase.';return}ch=client.channel('marvel:'+code,{config:{presence:{key:crypto.randomUUID()}}});ch.on('broadcast',{event:'state'},({payload})=>{if(payload.from===me)return;applying=true;S=payload.state;render();applying=false}).on('broadcast',{event:'request'},async({payload})=>{if(host&&payload.from!==me)broadcast()}).on('presence',{event:'sync'},()=>{let p=Object.values(ch.presenceState()).flat();$('players').innerHTML=p.map(x=>`<div class="player">🟢 <b>${x.name}</b>${x.host?' — anfitrião':''}</div>`).join('')});await ch.subscribe(async s=>{if(s==='SUBSCRIBED'){await ch.track({name,host});$('status').innerHTML=`<span class="live">● Sincronizado</span> — sala <b>${code}</b>`;if(!host)await ch.send({type:'broadcast',event:'request',payload:{from:me}})}})}$('room').onclick=()=>$('modal').classList.add('open');$('close').onclick=()=>$('modal').classList.remove('open');$('create').onclick=()=>{let c=Math.random().toString(36).slice(2,8).toUpperCase();$('code').textContent=c;connect(c,$('hostName').value,true)};$('join').onclick=()=>{let c=$('joinCode').value.trim().toUpperCase();if(c.length<4)return;connect(c,$('joinName').value,false);$('modal').classList.remove('open')};$('reveal').onclick=reveal;$('city').onclick=e=>{let c=e.target.closest('.card');if(!c)return;let card=S.city[+c.dataset.i];$('zoomImg').src=card.img||'';$('zoom').classList.add('open')};$('zoom').onclick=()=>$('zoom').classList.remove('open');render();</script></body></html>
