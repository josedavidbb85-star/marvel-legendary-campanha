name: Publicar Ecos v0.8.31
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-v0831.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -e
          cp index_v0830.html index_v0831.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index_v0831.html');s=p.read_text(encoding='utf-8')
          s=s.replace('Ecos da Ruptura v0.8.30','Ecos da Ruptura v0.8.31').replace('BUILD 0.8.30','BUILD 0.8.31')
          s=s.replace('<script src="narracao-sync-v0830.js?v=0830"></script>','<script src="narracao-sync-v0831.js?v=0831"></script>')
          p.write_text(s,encoding='utf-8')
          Path('index.html').write_text('''<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecos da Ruptura v0.8.31</title><meta http-equiv="refresh" content="0; url=./index_v0831.html"><script>location.replace('./index_v0831.html'+location.search+location.hash);</script></head><body><p>Abrindo Ecos da Ruptura v0.8.31…</p></body></html>''',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index_v0831.html index.html
          git commit -m 'Publica v0.8.31 com narracao deterministica'
          git push
