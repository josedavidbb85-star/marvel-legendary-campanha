name: Publicar v0.8.38
on:
  push:
    paths:
      - 'narracao-sync-v0838.js'
      - '.github/workflows/publicar-v0838.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar v0.8.38
        run: |
          cp index_v0837.html index_v0838.html
          sed -i 's/Ecos da Ruptura v0\.8\.37/Ecos da Ruptura v0.8.38/g' index_v0838.html
          sed -i 's/BUILD 0\.8\.37/BUILD 0.8.38/g' index_v0838.html
          sed -i 's/narracao-sync-v0837\.js/narracao-sync-v0838.js/g' index_v0838.html
          cat > index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=index_v0838.html"><script>location.replace('index_v0838.html'+location.search+location.hash)</script></head><body></body></html>
          EOF
      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index_v0838.html index.html
          git commit -m 'Publica v0.8.38: N1 sem narração de conclusão' || exit 0
          git push