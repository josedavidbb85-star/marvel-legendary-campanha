name: Publicar Ecos v0.8.33
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-v0833.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -e
          cp index_v0832.html index_v0833.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index_v0833.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('Ecos da Ruptura v0.8.32','Ecos da Ruptura v0.8.33').replace('BUILD 0.8.32','BUILD 0.8.33')
          s=s.replace('narracao-sync-v0832.js','narracao-sync-v0833.js')
          # Botões do narrador: Voltar = reiniciar áudio; Pausar = pausar. Remove ambiguidade funcional.
          s=s.replace("box.querySelector('.narRestart').onclick=()=>{if(current){nar.currentTime=0;nar.play().catch(()=>{});sync()}};", "box.querySelector('.narRestart').textContent='↶ Voltar';box.querySelector('.narRestart').onclick=()=>{if(current){nar.currentTime=0;nar.play().catch(()=>{});sync()}};")
          p.write_text(s,encoding='utf-8')
          Path('index.html').write_text('''<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecos da Ruptura v0.8.33</title><meta http-equiv="refresh" content="0; url=./index_v0833.html"><script>location.replace('./index_v0833.html'+location.search+location.hash);</script></head><body><p>Abrindo Ecos da Ruptura v0.8.33…</p></body></html>''',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index_v0833.html index.html narracao-sync-v0833.js
          git commit -m 'Publica v0.8.33: narra N2, conclusão e abertura cinematográfica'
          git push
